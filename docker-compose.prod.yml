x-backend-runtime: &backend-runtime
  image: neoimpact-marketing-backend:latest
  restart: unless-stopped
  env_file:
    - .env
  environment: &backend-environment
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    POSTGRES_PORT: "5432"
    WORKER_HEARTBEAT_SECONDS: "5"
    WORKER_RUNTIME_STALE_SECONDS: "30"
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - marketing-db
  stop_grace_period: 30s
  volumes:
    - attrition_model_data:/app/data/models/attrition
    - best_channel_model_data:/app/data/models/best_channel

services:
  postgres:
    image: postgres:17
    container_name: neoimpact-postgres
    restart: unless-stopped
    cpu_shares: 1024

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - neoimpact_postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

    networks:
      - marketing-db

  # API HTTP uniquement : aucun batch, campaign worker ou appel réseau lourd
  # ne tourne dans ce conteneur.
  marketing_app:
    <<: *backend-runtime
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketing_app
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    cpu_shares: 1024
    environment:
      <<: *backend-environment
      APP_PROCESS_ROLE: api
      POSTGRES_POOL_MIN_SIZE: "1"
      POSTGRES_POOL_MAX_SIZE: "6"
      POSTGRES_POOL_TIMEOUT_SECONDS: "5"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/health/ready >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - marketing-db
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.marketing-automation-api.rule=Host(`marketing-automation-api.axplitest.com`)"
      - "traefik.http.routers.marketing-automation-api.entrypoints=websecure"
      - "traefik.http.routers.marketing-automation-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.marketing-automation-api.loadbalancer.server.port=8000"

  marketing_campaign_worker:
    <<: *backend-runtime
    command: ["python", "-m", "app.workers.runner", "campaign"]
    cpu_shares: 768
    environment:
      <<: *backend-environment
      APP_PROCESS_ROLE: campaign_worker
      ORCHESTRATION_WORKER_ENABLED: "true"
      ORCHESTRATION_JOB_HEARTBEAT_SECONDS: "15"
      ORCHESTRATION_JOB_STALE_SECONDS: "120"
      POSTGRES_POOL_MIN_SIZE: "0"
      POSTGRES_POOL_MAX_SIZE: "2"
      POSTGRES_POOL_TIMEOUT_SECONDS: "10"
    healthcheck:
      test: ["CMD-SHELL", "python -m app.workers.healthcheck campaign"]
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 15s

  marketing_outbound_worker:
    <<: *backend-runtime
    command: ["python", "-m", "app.workers.runner", "outbound"]
    cpu_shares: 512
    environment:
      <<: *backend-environment
      APP_PROCESS_ROLE: outbound_worker
      OUTBOUND_WORKER_ENABLED: "true"
      POSTGRES_POOL_MIN_SIZE: "0"
      POSTGRES_POOL_MAX_SIZE: "4"
      POSTGRES_POOL_TIMEOUT_SECONDS: "10"
    healthcheck:
      test: ["CMD-SHELL", "python -m app.workers.healthcheck outbound"]
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 15s

  marketing_inbound_worker:
    <<: *backend-runtime
    command: ["python", "-m", "app.workers.runner", "inbound"]
    cpu_shares: 768
    environment:
      <<: *backend-environment
      APP_PROCESS_ROLE: inbound_worker
      INBOUND_WORKER_ENABLED: "true"
      POSTGRES_POOL_MIN_SIZE: "0"
      POSTGRES_POOL_MAX_SIZE: "3"
      POSTGRES_POOL_TIMEOUT_SECONDS: "10"
    healthcheck:
      test: ["CMD-SHELL", "python -m app.workers.healthcheck inbound"]
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 15s

  marketing_batch_worker:
    <<: *backend-runtime
    command: ["python", "-m", "app.workers.runner", "batch"]
    cpu_shares: 256
    environment:
      <<: *backend-environment
      APP_PROCESS_ROLE: batch_worker
      POSTGRES_POOL_MIN_SIZE: "0"
      POSTGRES_POOL_MAX_SIZE: "3"
      POSTGRES_POOL_TIMEOUT_SECONDS: "15"
    healthcheck:
      test: ["CMD-SHELL", "python -m app.workers.healthcheck batch"]
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 15s


  marketing_segmentation_worker:
    <<: *backend-runtime
    command: ["python", "-m", "app.workers.runner", "segmentation"]
    cpu_shares: 256
    environment:
      <<: *backend-environment
      APP_PROCESS_ROLE: segmentation_worker
      SEGMENTATION_WORKER_ENABLED: "true"
      SEGMENTATION_RUN_ON_START: "true"
      SEGMENTATION_TIMEZONE: "Africa/Casablanca"
      SEGMENTATION_DAILY_HOUR: "5"
      SEGMENTATION_DAILY_MINUTE: "0"
      POSTGRES_POOL_MIN_SIZE: "0"
      POSTGRES_POOL_MAX_SIZE: "2"
      POSTGRES_POOL_TIMEOUT_SECONDS: "15"
    healthcheck:
      test: ["CMD-SHELL", "python -m app.workers.healthcheck segmentation"]
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 30s

  marketing_attrition_worker:
    <<: *backend-runtime
    command: ["python", "-m", "app.workers.runner", "attrition"]
    cpu_shares: 384
    environment:
      <<: *backend-environment
      APP_PROCESS_ROLE: attrition_worker
      ATTRITION_WORKER_ENABLED: "true"
      ATTRITION_RUN_ON_START: "true"
      ATTRITION_TIMEZONE: "Africa/Casablanca"
      ATTRITION_MONTHLY_DAY: "1"
      ATTRITION_MONTHLY_HOUR: "6"
      ATTRITION_MONTHLY_MINUTE: "0"
      ATTRITION_RISK_THRESHOLD: "0.5"
      ATTRITION_SCORE_BATCH_SIZE: "25000"
      ATTRITION_XGBOOST_THREADS: "2"
      ATTRITION_MODEL_DIR: "/app/data/models/attrition"
      POSTGRES_POOL_MIN_SIZE: "0"
      POSTGRES_POOL_MAX_SIZE: "2"
      POSTGRES_POOL_TIMEOUT_SECONDS: "20"
    healthcheck:
      test: ["CMD-SHELL", "python -m app.workers.healthcheck attrition"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 60s


  marketing_digital_engagement_worker:
    <<: *backend-runtime
    command: ["python", "-m", "app.workers.runner", "digital_engagement"]
    cpu_shares: 256
    environment:
      <<: *backend-environment
      APP_PROCESS_ROLE: digital_engagement_worker
      DIGITAL_ENGAGEMENT_WORKER_ENABLED: "true"
      DIGITAL_ENGAGEMENT_RUN_ON_START: "true"
      DIGITAL_ENGAGEMENT_TIMEZONE: "Africa/Casablanca"
      DIGITAL_ENGAGEMENT_MONTHLY_DAY: "1"
      DIGITAL_ENGAGEMENT_MONTHLY_HOUR: "4"
      DIGITAL_ENGAGEMENT_MONTHLY_MINUTE: "0"
      DIGITAL_ENGAGEMENT_FAKE_BATCH_SIZE: "5000"
      POSTGRES_POOL_MIN_SIZE: "0"
      POSTGRES_POOL_MAX_SIZE: "2"
      POSTGRES_POOL_TIMEOUT_SECONDS: "20"
    healthcheck:
      test: ["CMD-SHELL", "python -m app.workers.healthcheck digital_engagement"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 60s


  marketing_best_channel_worker:
    <<: *backend-runtime
    command: ["python", "-m", "app.workers.runner", "best_channel"]
    cpu_shares: 384
    environment:
      <<: *backend-environment
      APP_PROCESS_ROLE: best_channel_worker
      BEST_CHANNEL_WORKER_ENABLED: "true"
      BEST_CHANNEL_RUN_ON_START: "true"
      BEST_CHANNEL_TIMEZONE: "Africa/Casablanca"
      BEST_CHANNEL_DAILY_HOUR: "3"
      BEST_CHANNEL_DAILY_MINUTE: "0"
      BEST_CHANNEL_SCORE_BATCH_SIZE: "20000"
      BEST_CHANNEL_FAKE_BATCH_SIZE: "5000"
      BEST_CHANNEL_XGBOOST_THREADS: "2"
      BEST_CHANNEL_MODEL_DIR: "/app/data/models/best_channel"
      POSTGRES_POOL_MIN_SIZE: "0"
      POSTGRES_POOL_MAX_SIZE: "2"
      POSTGRES_POOL_TIMEOUT_SECONDS: "20"
    healthcheck:
      test: ["CMD-SHELL", "python -m app.workers.healthcheck best_channel"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 60s


  marketing_commercial_pressure_worker:
    <<: *backend-runtime
    command: ["python", "-m", "app.workers.runner", "commercial_pressure"]
    cpu_shares: 256
    environment:
      <<: *backend-environment
      APP_PROCESS_ROLE: commercial_pressure_worker
      COMMERCIAL_PRESSURE_WORKER_ENABLED: "true"
      COMMERCIAL_PRESSURE_RUN_ON_START: "true"
      COMMERCIAL_PRESSURE_TIMEZONE: "Africa/Casablanca"
      COMMERCIAL_PRESSURE_MONTHLY_DAY: "1"
      COMMERCIAL_PRESSURE_MONTHLY_HOUR: "2"
      COMMERCIAL_PRESSURE_MONTHLY_MINUTE: "0"
      COMMERCIAL_PRESSURE_BATCH_SIZE: "20000"
      COMMERCIAL_PRESSURE_FAKE_BATCH_SIZE: "5000"
      POSTGRES_POOL_MIN_SIZE: "0"
      POSTGRES_POOL_MAX_SIZE: "2"
      POSTGRES_POOL_TIMEOUT_SECONDS: "20"
    healthcheck:
      test: ["CMD-SHELL", "python -m app.workers.healthcheck commercial_pressure"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 60s


  marketing_frontend:
    build:
      context: ./campain-app-main
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: https://marketing-automation-api.axplitest.com/api
        VITE_AUTH_URL: https://marketing-automation-api.axplitest.com/api
    container_name: marketing_frontend
    restart: unless-stopped
    cpu_shares: 512

    depends_on:
      marketing_app:
        condition: service_healthy

    networks:
      - traefik-public

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.marketing-automation-frontend.rule=Host(`marketing-automation.axplitest.com`)"
      - "traefik.http.routers.marketing-automation-frontend.entrypoints=websecure"
      - "traefik.http.routers.marketing-automation-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.marketing-automation-frontend.loadbalancer.server.port=80"

networks:
  marketing-db:
    driver: bridge
  traefik-public:
    external: true

volumes:
  neoimpact_postgres_data:
  attrition_model_data:
  best_channel_model_data:
