services:
  postgres:
    image: postgres:17
    container_name: neoimpact-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - neoimpact_postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  marketing_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketing_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      POSTGRES_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      - "8000:8000"

  marketing_frontend:
    build:
      context: ./campain-app-main
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: https://marketing-automation-api.axplitest.com/api
        VITE_AUTH_URL: https://marketing-automation-api.axplitest.com/api
    container_name: marketing_frontend
    restart: unless-stopped
    depends_on:
      - marketing_app
    ports:
      - "8081:80"

volumes:
  neoimpact_postgres_data:
