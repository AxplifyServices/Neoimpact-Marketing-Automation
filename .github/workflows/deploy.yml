name: Deploy Marketing Automation

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -Eeuo pipefail

            cd /opt/apps/marketing-automation/repo

            git fetch origin
            git reset --hard origin/main

            COMPOSE_FILE=docker-compose.prod.yml

            # Transition depuis un éventuel ancien projet Compose.
            for container in marketing_app marketing_frontend neoimpact-postgres; do
              if docker ps -a --format '{{.Names}}' | grep -qx "$container"; then
                project="$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' "$container" 2>/dev/null || true)"
                if [ "$project" != "repo" ]; then
                  echo "Removing legacy container: $container"
                  docker rm -f "$container"
                fi
              fi
            done

            # Vérifie la configuration avant de toucher aux services en production.
            docker compose -f "$COMPOSE_FILE" config -q

            # Construit les nouvelles images sans arrêter les conteneurs applicatifs
            # actuellement en service.
            docker compose -f "$COMPOSE_FILE" build marketing_app marketing_frontend

            # PostgreSQL doit être disponible AVANT les migrations et AVANT le
            # démarrage du nouveau backend. On ne le force plus à être recréé à
            # chaque push : le volume et le cache restent stables.
            docker compose -f "$COMPOSE_FILE" up -d postgres

            echo "Waiting for PostgreSQL..."
            postgres_ok=0
            for i in $(seq 1 60); do
              if docker compose -f "$COMPOSE_FILE" exec -T postgres sh -lc \
                'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"' \
                >/dev/null 2>&1; then
                postgres_ok=1
                break
              fi
              sleep 2
            done

            if [ "$postgres_ok" -ne 1 ]; then
              echo "PostgreSQL did not become ready."
              docker compose -f "$COMPOSE_FILE" ps postgres || true
              docker logs neoimpact-postgres --tail 200 || true
              exit 1
            fi

            # Les migrations DDL (ALTER TABLE / CREATE INDEX) peuvent nécessiter
            # des verrous exclusifs. L'ancien backend et les workers gardent des
            # connexions PostgreSQL actives et peuvent provoquer un deadlock
            # pendant ces migrations. Les images ont déjà été construites :
            # on arrête donc uniquement les processus qui utilisent la base juste
            # avant la migration, puis ils seront recréés plus bas comme avant.
            echo "Stopping database clients before schema migrations..."
            for service in \
              marketing_app \
              marketing_campaign_worker \
              marketing_outbound_worker \
              marketing_inbound_worker \
              marketing_batch_worker \
              marketing_segmentation_worker \
              marketing_attrition_worker \
              marketing_digital_engagement_worker \
              marketing_best_channel_worker; do
              container_id="$(docker compose -f "$COMPOSE_FILE" ps -q "$service" 2>/dev/null || true)"
              if [ -n "$container_id" ]; then
                echo "Stopping $service..."
                docker compose -f "$COMPOSE_FILE" stop -t 30 "$service"
              fi
            done

            # IMPORTANT : le schéma est mis à niveau avant le nouveau backend.
            # Ainsi /api/health et les workers peuvent utiliser immédiatement les
            # tables/colonnes du commit en cours.
            COMPOSE_FILE="$COMPOSE_FILE" bash deploy/apply_migrations.sh

            echo "Starting backend..."
            docker compose -f "$COMPOSE_FILE" up -d \
              --no-deps --force-recreate marketing_app

            echo "Waiting for backend health..."
            backend_ok=0
            for i in $(seq 1 60); do
              if docker compose -f "$COMPOSE_FILE" exec -T marketing_app \
                curl -fsS http://127.0.0.1:8000/api/health/ready \
                >/dev/null 2>&1; then
                backend_ok=1
                break
              fi
              sleep 2
            done

            if [ "$backend_ok" -ne 1 ]; then
              echo "Backend did not become healthy."
              echo "Backend container status:"
              docker compose -f "$COMPOSE_FILE" ps marketing_app || true
              echo "Backend logs:"
              docker logs marketing_app --tail 250 || true
              exit 1
            fi

            echo "Backend is healthy."

            # Les moteurs de fond utilisent exactement la même image Python que
            # l'API, mais vivent dans des conteneurs séparés. L'ancien backend
            # embarqué a déjà été remplacé ci-dessus, donc il n'y a pas de fenêtre
            # avec deux jeux de workers actifs dans le même conteneur API.
            echo "Starting dedicated workers..."
            docker compose -f "$COMPOSE_FILE" up -d --no-deps --force-recreate \
              marketing_campaign_worker \
              marketing_outbound_worker \
              marketing_inbound_worker \
              marketing_batch_worker \
              marketing_segmentation_worker \
              marketing_attrition_worker \
              marketing_digital_engagement_worker \
              marketing_best_channel_worker

            wait_worker() {
              service="$1"
              role="$2"
              worker_ok=0
              for i in $(seq 1 60); do
                if docker compose -f "$COMPOSE_FILE" exec -T "$service" \
                  python -m app.workers.healthcheck "$role" \
                  >/dev/null 2>&1; then
                  worker_ok=1
                  break
                fi
                sleep 2
              done
              if [ "$worker_ok" -ne 1 ]; then
                echo "Worker did not become healthy: $service ($role)"
                docker compose -f "$COMPOSE_FILE" ps "$service" || true
                docker compose -f "$COMPOSE_FILE" logs --tail 250 "$service" || true
                exit 1
              fi
              echo "Worker is healthy: $service ($role)"
            }

            wait_worker marketing_campaign_worker campaign
            wait_worker marketing_outbound_worker outbound
            wait_worker marketing_inbound_worker inbound
            wait_worker marketing_batch_worker batch
            wait_worker marketing_segmentation_worker segmentation
            wait_worker marketing_attrition_worker attrition
            wait_worker marketing_digital_engagement_worker digital_engagement
            wait_worker marketing_best_channel_worker best_channel

            # Le frontend n'est remplacé qu'une fois l'API ET les moteurs prêts.
            echo "Starting frontend..."
            docker compose -f "$COMPOSE_FILE" up -d \
              --no-deps --force-recreate marketing_frontend

            echo "Waiting for frontend health..."
            frontend_ok=0
            for i in $(seq 1 60); do
              if docker compose -f "$COMPOSE_FILE" exec -T marketing_frontend \
                wget -q -O - http://127.0.0.1/health \
                >/dev/null 2>&1; then
                frontend_ok=1
                break
              fi
              sleep 2
            done

            if [ "$frontend_ok" -ne 1 ]; then
              echo "Frontend did not become healthy."
              echo "Frontend container status:"
              docker compose -f "$COMPOSE_FILE" ps marketing_frontend || true
              echo "Frontend logs:"
              docker logs marketing_frontend --tail 250 || true
              exit 1
            fi

            echo "Frontend is healthy."

            # Nettoyage uniquement après un déploiement sain.
            docker compose -f "$COMPOSE_FILE" up -d --remove-orphans

            echo "Deployment status:"
            docker compose -f "$COMPOSE_FILE" ps

            echo "Backend logs:"
            docker logs marketing_app --tail 50

            echo "Worker logs:"
            docker compose -f "$COMPOSE_FILE" logs --tail 30 \
              marketing_campaign_worker \
              marketing_outbound_worker \
              marketing_inbound_worker \
              marketing_batch_worker \
              marketing_segmentation_worker \
              marketing_attrition_worker \
              marketing_digital_engagement_worker \
              marketing_best_channel_worker

            echo "Frontend logs:"
            docker logs marketing_frontend --tail 50
