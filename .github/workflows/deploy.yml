name: Deploy Marketing Automation

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /opt/apps/marketing-automation/repo

            git fetch origin
            git reset --hard origin/main

            # Transition depuis un éventuel ancien projet Compose.
            for container in marketing_app marketing_frontend neoimpact-postgres; do
              if docker ps -a --format '{{.Names}}' | grep -qx "$container"; then
                project="$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' "$container" 2>/dev/null || true)"
                if [ "$project" != "repo" ]; then
                  echo "Removing legacy container: $container"
                  docker rm -f "$container"
                fi
              fi
            done

            # Même principe que le projet Hire :
            # Traefik route directement les conteneurs via traefik-public.
            docker compose -f docker-compose.prod.yml up -d --build --force-recreate --remove-orphans

            echo "Waiting for PostgreSQL..."
            until docker compose -f docker-compose.prod.yml exec -T postgres sh -lc               'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'               >/dev/null 2>&1; do
              sleep 2
            done

            # 001_schema.sql est exécuté automatiquement seulement
            # lors de l'initialisation d'un volume PostgreSQL neuf.
            for migration in database/init/*.sql; do
              [ -f "$migration" ] || continue

              if [ "$(basename "$migration")" = "001_schema.sql" ]; then
                continue
              fi

              echo "Applying migration: $migration"

              docker compose -f docker-compose.prod.yml exec -T postgres sh -lc                 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"'                 < "$migration"
            done

            echo "Checking backend..."
            docker compose -f docker-compose.prod.yml exec -T marketing_app               curl -fsS http://127.0.0.1:8000/api/health

            echo "Checking frontend..."
            docker compose -f docker-compose.prod.yml exec -T marketing_frontend               wget -q -O - http://127.0.0.1/health

            echo "Deployment status:"
            docker compose -f docker-compose.prod.yml ps

            echo "Backend logs:"
            docker logs marketing_app --tail 50

            echo "Frontend logs:"
            docker logs marketing_frontend --tail 50
