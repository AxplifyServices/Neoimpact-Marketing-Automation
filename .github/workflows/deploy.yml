name: Deploy Marketing Automation

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /opt/apps/marketing-automation/repo

            git fetch origin
            git reset --hard origin/main

            # Transition depuis l'ancien déploiement :
            # l'ancien conteneur marketing_app peut appartenir à un autre
            # projet Docker Compose et ne sera donc pas supprimé par
            # --remove-orphans du nouveau projet.
            #
            # On ne touche qu'au conteneur applicatif historique.
            # Le PostgreSQL installé nativement sur le VPS n'est pas concerné.
            if docker ps -a --format '{{.Names}}' | grep -qx 'marketing_app'; then
              echo "Removing legacy marketing_app container..."
              docker rm -f marketing_app
            fi

            # Build + démarrage de l'application et du PostgreSQL Docker.
            # PostgreSQL n'expose aucun port hôte dans compose.yaml.
            docker compose -f compose.yaml up -d --build --remove-orphans

            echo "Waiting for PostgreSQL..."
            until docker compose -f compose.yaml exec -T postgres sh -lc \
              'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"' \
              >/dev/null 2>&1; do
              sleep 2
            done

            # 001_schema.sql est exécuté automatiquement uniquement lors de
            # l'initialisation d'un volume PostgreSQL neuf.
            #
            # Les migrations suivantes doivent rester idempotentes car elles
            # sont rejouées à chaque déploiement.
            for migration in database/init/*.sql; do
              [ -f "$migration" ] || continue

              if [ "$(basename "$migration")" = "001_schema.sql" ]; then
                continue
              fi

              echo "Applying migration: $migration"

              docker compose -f compose.yaml exec -T postgres sh -lc \
                'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' \
                < "$migration"
            done

            echo "Deployment status:"
            docker compose -f compose.yaml ps
